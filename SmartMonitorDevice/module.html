<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ═══════════════════════════════════════════════════════════
   GERÄTE MONITOR – IP-Symcon HTML-SDK (PREMIUM DESIGN)
   ═══════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --card-color: #1e1e2e;
    --content-color: #cdd6f4;
    --accent-color: #ff4785;
    --bg-color: #181825;
    
    --safe-green: #00b894;
    --warn-yellow: #f1c40f;
    --alarm-red: #ff4785;
    
    --glass-bg: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.06);
}

html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    color: var(--content-color);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
}

.tile-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
    padding-top: 15px;
    overflow-y: auto;
}

.tile-content {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* ── HEADER ── */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--glass-border);
}

.header-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
}

.header-title svg {
    width: 20px;
    height: 20px;
    color: var(--content-color);
}

.status-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    transition: all 0.5s ease;
}

.status-badge.safe { background: rgba(0, 184, 148, 0.15); color: var(--safe-green); border-color: rgba(0, 184, 148, 0.3); }
.status-badge.warn { background: rgba(241, 196, 15, 0.15); color: var(--warn-yellow); border-color: rgba(241, 196, 15, 0.3); box-shadow: 0 0 10px rgba(241, 196, 15, 0.2); }
.status-badge.alarm { background: rgba(255, 71, 133, 0.15); color: var(--alarm-red); border-color: rgba(255, 71, 133, 0.3); box-shadow: 0 0 10px rgba(255, 71, 133, 0.3); }

/* ── HAUPTBEREICH (Schild) ── */
.main-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.shield-container {
    position: relative;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2));
    box-shadow: 
        inset 0 0 15px rgba(0,0,0,0.5),
        0 10px 20px rgba(0,0,0,0.3),
        0 0 0 1px rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.5s ease;
}

.shield-container svg {
    width: 50px;
    height: 50px;
    color: var(--content-color);
    opacity: 0.5;
    transition: all 0.5s ease;
}

.shield-container.safe {
    box-shadow: 
        inset 0 0 20px rgba(0,184,148,0.1),
        0 10px 20px rgba(0,0,0,0.3),
        0 0 0 1px rgba(0,184,148,0.2);
}
.shield-container.safe svg { color: var(--safe-green); opacity: 0.8; }

.shield-container.warn {
    box-shadow: 
        inset 0 0 20px rgba(241,196,15,0.2),
        0 0 30px rgba(241,196,15,0.2),
        0 0 0 1px rgba(241,196,15,0.4);
}
.shield-container.warn svg { color: var(--warn-yellow); opacity: 1; filter: drop-shadow(0 0 5px var(--warn-yellow)); }

.shield-container.alarm {
    box-shadow: 
        inset 0 0 20px rgba(255,71,133,0.3),
        0 0 30px rgba(255,71,133,0.4),
        0 0 0 1px rgba(255,71,133,0.5);
    animation: pulse-alarm 1s infinite alternate;
}
.shield-container.alarm svg { color: var(--alarm-red); opacity: 1; filter: drop-shadow(0 0 8px var(--alarm-red)); }

@keyframes pulse-alarm {
    0% { transform: scale(1); box-shadow: inset 0 0 20px rgba(255,71,133,0.3), 0 0 20px rgba(255,71,133,0.3); }
    100% { transform: scale(1.05); box-shadow: inset 0 0 30px rgba(255,71,133,0.5), 0 0 40px rgba(255,71,133,0.6); }
}

/* ── SENSOR LISTE (Pills) ── */
.sensor-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    width: 100%;
}

.sensor-pill {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.sensor-pill.warn { border-color: rgba(241, 196, 15, 0.4); background: rgba(241, 196, 15, 0.1); color: var(--warn-yellow); }
.sensor-pill.alarm { border-color: rgba(255, 71, 133, 0.4); background: rgba(255, 71, 133, 0.1); color: var(--alarm-red); }
.sensor-pill.safe { border-color: rgba(0, 184, 148, 0.2); color: var(--safe-green); }

</style>
</head>
<body>

<div class="tile-wrapper">
    <div class="tile-content">
        
        <div class="header">
            <div class="header-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                Geräte Monitor
            </div>
            <div id="statusBadge" class="status-badge safe">OK</div>
        </div>

        <div class="main-area">
            <div id="shieldContainer" class="shield-container safe">
                <!-- Server / Herz Icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
            </div>
            
            <div id="sensorList" class="sensor-list">
                <div class="sensor-pill safe">Lade Daten...</div>
            </div>
        </div>

    </div>
</div>

<script>
function handleMessage(data) {
    if (!data) return;
    try {
        const parsed = JSON.parse(data);
        render(parsed);
    } catch (e) {
        console.error("JSON Parse Error:", e);
    }
}

function render(data) {
    const statusBadge = document.getElementById('statusBadge');
    const shieldContainer = document.getElementById('shieldContainer');
    const sensorList = document.getElementById('sensorList');
    
    // Reset Classes
    statusBadge.className = 'status-badge';
    shieldContainer.className = 'shield-container';
    
    let batCount = (data.lowBatteries || []).length;
    let offCount = (data.offlineDevices || []).length;
    let orphaCount = (data.orphanedVars || []).length;
    let warnCount = (data.warnings || []).length;
    
    let hasAlarm = offCount > 0 || orphaCount > 0;
    let hasWarn = batCount > 0 || warnCount > 0;
    
    if (hasAlarm) {
        statusBadge.classList.add('alarm');
        statusBadge.textContent = 'FEHLER';
        shieldContainer.classList.add('alarm');
        shieldContainer.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
    } else if (hasWarn) {
        statusBadge.classList.add('warn');
        statusBadge.textContent = 'WARNUNG';
        shieldContainer.classList.add('warn');
        shieldContainer.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
    } else {
        statusBadge.classList.add('safe');
        statusBadge.textContent = 'ALLES OK';
        shieldContainer.classList.add('safe');
        shieldContainer.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
    }
    
    // Render Sensor Pills
    sensorList.innerHTML = '';
    if (!hasAlarm && !hasWarn) {
        sensorList.innerHTML = '<div class="sensor-pill safe"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> System Status Gesund</div>';
    } else {
        if (data.offlineDevices) {
            data.offlineDevices.forEach(d => {
                sensorList.innerHTML += <div class="sensor-pill alarm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path><line x1="8" y1="16" x2="16" y2="8"></line></svg> Offline: </div>;
            });
        }
        if (data.orphanedVars) {
            data.orphanedVars.forEach(d => {
                sensorList.innerHTML += <div class="sensor-pill alarm"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> </div>;
            });
        }
        if (data.lowBatteries) {
            data.lowBatteries.forEach(d => {
                sensorList.innerHTML += <div class="sensor-pill warn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="13" x2="23" y2="11"></line><line x1="6" y1="12" x2="6" y2="12"></line></svg> Batterie: </div>;
            });
        }
        if (data.warnings) {
            data.warnings.forEach(d => {
                sensorList.innerHTML += <div class="sensor-pill warn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> Warnung: </div>;
            });
        }
    }
}

// Beim Start anfragen
requestAction('Init', 0);
</script>

</body>
</html>
